services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: theis
      POSTGRES_PASSWORD: theis_local_pw
      POSTGRES_DB: theis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theis"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://theis:theis_local_pw@db:5432/theis
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
